<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>District Insights — Zaka District Schools Hub</title>
<style>
  :root {
    --primary: #0f3d2e;
    --primary-dark: #1a5c47;
    --secondary: #d4af37;
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --text: #2d3748;
    --text-muted: #718096;
    --danger: #e53e3e;
    --success: #38a169;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); line-height: 1.6; padding-bottom: 24px; }
  header {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    padding: 20px;
    border-bottom: 4px solid var(--secondary);
  }
  header h1 { font-size: 1.4rem; }
  header p { font-size: 0.85rem; color: #cbd5e0; margin-top: 4px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  .btn {
    display: inline-block;
    background: var(--primary);
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }
  .btn:hover { background: var(--primary-dark); }
  .back-link { margin-bottom: 14px; }
  .badge {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 20px;
    margin: 0 6px 6px 0;
  }
  .badge-period { background: #e6f4ec; color: var(--primary); }
  .badge-sample { background: #fff5e0; color: #8a5a00; border: 1px solid #e0b84a; }
  .updated-label { font-size: 0.8rem; color: var(--text-muted); margin: 4px 0 16px; }
  .card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .card h2 { font-size: 1.05rem; margin-bottom: 8px; color: var(--primary); }
  .summary-line { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
  .indicator-card h3 { font-size: 0.95rem; margin-bottom: 6px; }
  .indicator-value { font-size: 1.6rem; font-weight: 700; color: var(--primary); }
  .indicator-unit { font-size: 0.85rem; color: var(--text-muted); font-weight: 400; }
  .progress-track {
    background: #e2e8f0;
    border-radius: 8px;
    height: 14px;
    margin: 8px 0 6px;
    overflow: hidden;
  }
  .progress-fill { background: var(--primary); height: 100%; border-radius: 8px 0 0 8px; }
  .progress-text { font-size: 0.85rem; color: var(--text-muted); }
  .indicator-desc { font-size: 0.85rem; color: var(--text-muted); margin-top: 6px; }
  ul.priority-list { padding-left: 20px; }
  ul.priority-list li { margin-bottom: 6px; font-size: 0.95rem; }
  .note-box {
    background: #f0f7f4;
    border-left: 4px solid var(--secondary);
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .privacy-statement {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--primary);
    text-align: center;
    padding: 14px;
    background: #e6f4ec;
    border-radius: 8px;
    margin-top: 16px;
  }
  .state-box { text-align: center; padding: 30px 16px; color: var(--text-muted); }
  .state-box .icon { font-size: 2rem; margin-bottom: 10px; }
  #retryBtn { margin-top: 12px; }
</style>
</head>
<body>

<header>
  <h1>📊 District Insights</h1>
  <p>Approved district-level planning information</p>
</header>

<main>
  <div class="back-link">
    <a class="btn" href="index.html">← Back to Hub</a>
  </div>

  <div id="loadingState" class="state-box">
    <div class="icon">⏳</div>
    <p>Loading district insights…</p>
  </div>

  <div id="errorState" class="state-box" style="display:none;">
    <div class="icon">⚠️</div>
    <p>District insight information is temporarily unavailable. Please try again later.</p>
    <button class="btn" id="retryBtn">Retry</button>
  </div>

  <div id="emptyState" class="state-box" style="display:none;">
    <div class="icon">📭</div>
    <p>Approved district insight data is not available yet. Please check back later.</p>
  </div>

  <div id="content" style="display:none;"></div>
</main>

<script>
  async function loadDistrictSummary() {
    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');
    const emptyState = document.getElementById('emptyState');
    const content = document.getElementById('content');

    loadingState.style.display = 'block';
    errorState.style.display = 'none';
    emptyState.style.display = 'none';
    content.style.display = 'none';

    try {
      const response = await fetch('data/district-summary.json');
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();

      if (!data.indicators || data.indicators.length === 0) {
        loadingState.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }

      renderContent(data);
      loadingState.style.display = 'none';
      content.style.display = 'block';
    } catch (error) {
      console.error('District Insights load error:', error);
      loadingState.style.display = 'none';
      errorState.style.display = 'block';
    }
  }

  // Safe percentage: guards against missing, zero, or invalid totals.
  function safePercent(value, total) {
    if (typeof value !== 'number' || typeof total !== 'number' || total <= 0) return null;
    return Math.round((value / total) * 100);
  }

  function esc(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function renderContent(data) {
    const submissionPct = safePercent(data.submissionsReceived, data.schoolsExpected);

    let html = `
      <div style="margin-bottom:14px;">
        <span class="badge badge-period">🗓️ ${esc(data.reportingPeriod || 'Reporting period not set')}</span>
        ${data.dataStatus === 'sample' ? `<span class="badge badge-sample">⚠️ Sample Data — Not Official District Statistics</span>` : ''}
      </div>
      <p class="updated-label">Last updated: ${esc(data.lastUpdated || 'Not available')}</p>

      <div class="card">
        <h2>Approved Returns</h2>
        <p class="summary-line">Approved returns received: ${esc(data.submissionsReceived)} of ${esc(data.schoolsExpected)} schools</p>
        ${submissionPct !== null ? `
          <div class="progress-track" role="progressbar" aria-valuenow="${submissionPct}" aria-valuemin="0" aria-valuemax="100" aria-label="Schools reporting: ${submissionPct}%">
            <div class="progress-fill" style="width:${submissionPct}%;"></div>
          </div>
          <p class="progress-text">${esc(data.submissionsReceived)} of ${esc(data.schoolsExpected)} schools, ${submissionPct}%</p>
        ` : `<p class="progress-text">Percentage not available.</p>`}
      </div>
    `;

    html += `<h2 style="margin:18px 0 10px; color:var(--primary);">Key Indicators</h2>`;
    data.indicators.forEach(ind => {
      const pct = safePercent(ind.value, ind.total);
      html += `
        <div class="card indicator-card">
          <h3>${esc(ind.label)}</h3>
          <p class="indicator-value">${esc(ind.value)}${ind.total ? ` <span class="indicator-unit">of ${esc(ind.total)} ${esc(ind.unit || '')}</span>` : ` <span class="indicator-unit">${esc(ind.unit || '')}</span>`}</p>
          ${pct !== null ? `
            <div class="progress-track" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(ind.label)}: ${pct}%">
              <div class="progress-fill" style="width:${pct}%;"></div>
            </div>
            <p class="progress-text">${esc(ind.value)} of ${esc(ind.total)} ${esc(ind.unit || '')}, ${pct}%</p>
          ` : ''}
          ${ind.description ? `<p class="indicator-desc">${esc(ind.description)}</p>` : ''}
        </div>
      `;
    });

    if (data.priorityAreas && data.priorityAreas.length) {
      html += `
        <div class="card">
          <h2>Priority Support Areas</h2>
          <ol class="priority-list">
            ${data.priorityAreas.map(area => `<li>${esc(area)}</li>`).join('')}
          </ol>
        </div>
      `;
    }

    html += `
      <div class="card">
        <h2>How to Read This Dashboard</h2>
        <p style="font-size:0.9rem; margin-bottom:6px;">• Figures are aggregated at district level — not tied to any single school.</p>
        <p style="font-size:0.9rem; margin-bottom:6px;">• This is planning and public-information material, not an official statistics release.</p>
        <p style="font-size:0.9rem; margin-bottom:6px;">• It does not identify individual schools, learners or staff.</p>
        <p style="font-size:0.9rem;">• It must not be used to rank, shame or judge any school.</p>
      </div>
    `;

    if (data.methodologyNote || data.privacyNote) {
      html += `<div class="note-box"><b>Methodology:</b> ${esc(data.methodologyNote || 'Not provided.')}</div>`;
      html += `<div class="note-box"><b>Privacy:</b> ${esc(data.privacyNote || 'Not provided.')}</div>`;
    }

    html += `<p class="privacy-statement">🔒 No individual learner, parent, teacher, staff member or named school is displayed on this page.</p>`;

    document.getElementById('content').innerHTML = html;
  }

  document.getElementById('retryBtn').addEventListener('click', loadDistrictSummary);
  loadDistrictSummary();
</script>

</body>
</html>
