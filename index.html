    // ── REUSABLE QUIZ ENGINE ─────────────────────────────────────────────
    // Works with any topic.quiz object (see Literature F3 "Introduction to
    // Unseen Passages" for the data shape). No login, no Firebase — score
    // is local to this device only and never treated as an official mark.
    // ── LEARNER POINTS (local to this device, no accounts) ──────────────
    const POINTS_KEY = 'zaka_learner_points';
    function getLearnerPoints() { return parseInt(localStorage.getItem(POINTS_KEY) || '0', 10); }
    function addLearnerPoints(n) {
      const total = getLearnerPoints() + n;
      localStorage.setItem(POINTS_KEY, total.toString());
      return total;
    }

    let quizState = null;

    function startQuiz(formNum, index, level, dept) {
      level = level || 'olevel';
      const quiz = (level === 'alevel')
        ? content.learnerALevel.forms[formNum].departments[dept].topics[index].quiz
        : content.learner.forms[formNum].topics[index].quiz;
      quizState = { formNum, index, level, dept, quiz, current: 0, score: 0, answered: false, streak: 0, pointsEarned: 0 };
      renderQuizQuestion();
    }

    function renderQuizQuestion() {
      const { quiz, current } = quizState;
      const q = quiz.questions[current];
      let html = `<button class="btn btn-secondary" style="margin-bottom:12px;" onclick="openLessonDetail('${quizState.formNum}', ${quizState.index}, '${quizState.level}', '${quizState.dept || ''}')">← Back to Lesson</button>`;
      html += `<h2>📝 ${quiz.title}</h2>`;
      html += `<p style="color:var(--text-muted); margin-bottom:10px;">Question ${current + 1} of ${quiz.questions.length}</p>`;
      if (quizState.streak >= 2) {
        html += `<div class="streak-badge">🔥 ${quizState.streak} in a row!</div>`;
      }
      html += `<div class="card"><p style="font-weight:600; margin-bottom:14px;">${q.question}</p>`;
      q.options.forEach((opt, i) => {
        html += `<button class="btn btn-secondary" style="width:100%; text-align:left; margin-bottom:8px;" id="quizOpt${i}" onclick="selectQuizAnswer(${i})">${opt}</button>`;
      });
      html += `<p id="quizFeedback" style="display:none; margin-top:10px; padding:10px; border-radius:6px;"></p>`;
      html += `<button class="btn" id="quizNextBtn" style="display:none; width:100%; margin-top:10px;" onclick="nextQuizQuestion()">Next Question →</button>`;
      html += `</div>`;
      document.getElementById('app').innerHTML = html;
    }

    function selectQuizAnswer(selectedIndex) {
      if (quizState.answered) return; // prevent changing the answer after submitting
      quizState.answered = true;
      const q = quizState.quiz.questions[quizState.current];
      const correct = selectedIndex === q.answer;

      if (correct) {
        quizState.score++;
        quizState.streak++;
        const streakBonus = quizState.streak >= 3 ? 5 : 0;
        const earned = 10 + streakBonus;
        quizState.pointsEarned += earned;
        addLearnerPoints(earned);
        spawnCelebrationBurst(document.getElementById('quizOpt' + selectedIndex));
      } else {
        quizState.streak = 0;
      }

      q.options.forEach((opt, i) => {
        const btn = document.getElementById('quizOpt' + i);
        btn.disabled = true;
        if (i === q.answer) btn.style.cssText += 'background:#c6f6d5; border-color:var(--success); font-weight:700;';
        else if (i === selectedIndex) btn.style.cssText += 'background:#fed7d7; border-color:#e53e3e;';
      });

      if (correct) document.getElementById('quizOpt' + selectedIndex).classList.add('celebrate-pop');

      const feedback = document.getElementById('quizFeedback');
      feedback.style.display = 'block';
      feedback.style.background = correct ? '#c6f6d5' : '#fff5f5';
      feedback.style.borderLeft = correct ? '3px solid var(--success)' : '3px solid #e53e3e';
      const pointsLine = correct ? ` <span style="opacity:0.8;">(+${10 + (quizState.streak >= 3 ? 5 : 0)} pts${quizState.streak >= 3 ? ' incl. streak bonus' : ''})</span>` : '';
      feedback.innerHTML = `<b>${correct ? '✅ Correct!' : '❌ Not quite.'}</b>${pointsLine} ${q.explanation}`;

      document.getElementById('quizNextBtn').style.display = 'block';
    }

    // Spawns a couple of floating emoji over a given element, purely
    // decorative and CSS-driven — cleans itself up after the animation.
    function spawnCelebrationBurst(anchorEl) {
      if (!anchorEl) return;
      const rect = anchorEl.getBoundingClientRect();
      const emojis = ['🎉', '⭐'];
      emojis.forEach((emoji, i) => {
        const el = document.createElement('div');
        el.className = 'celebrate-burst';
        el.textContent = emoji;
        el.style.left = (rect.left + rect.width / 2 + (i === 0 ? -14 : 14)) + 'px';
        el.style.top = (rect.top) + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1000);
      });
    }

    function nextQuizQuestion() {
      quizState.current++;
      quizState.answered = false;
      if (quizState.current < quizState.quiz.questions.length) {
        renderQuizQuestion();
      } else {
        renderQuizScore();
      }
    }

    function renderQuizScore() {
      const { quiz, score, formNum, index, level, dept, pointsEarned } = quizState;
      const total = quiz.questions.length;
      const ratio = score / total;
      let feedback, stars;
      if (ratio <= 0.4) { feedback = "Keep practising. Revisit the lesson notes and try again."; stars = 1; }
      else if (ratio < 0.85) { feedback = "Good effort. Review the questions you missed and try again."; stars = 2; }
      else { feedback = "Excellent work! You're ready for the next topic."; stars = 3; }

      let starsHtml = '';
      for (let i = 0; i < 3; i++) {
        starsHtml += `<span class="star-in" style="animation-delay:${i * 0.15}s;">${i < stars ? '⭐' : '☆'}</span>`;
      }

      let html = `<h2>📝 Quiz Complete</h2>`;
      html += `<div class="card" style="text-align:center;">
        <div class="star-rating" style="margin-bottom:6px;">${starsHtml}</div>
        <p style="font-size:2rem; font-weight:700; color:var(--primary); margin-bottom:4px;">${score} / ${total}</p>
        <p style="color:var(--text-muted); margin-bottom:14px;">${feedback}</p>
        <div class="points-badge">✨ +${pointsEarned} points this quiz · ${getLearnerPoints()} total</div>
        <p style="font-size:0.75rem; color:var(--text-muted); font-style:italic;">Personal practice record — this is not an official school mark.</p>
      </div>`;
      html += `<button class="btn" style="width:100%; margin-bottom:8px;" onclick="startQuiz('${formNum}', ${index}, '${level}', '${dept || ''}')">🔁 Retry Quiz</button>`;
      html += `<button class="btn btn-secondary" style="width:100%;" onclick="openLessonDetail('${formNum}', ${index}, '${level}', '${dept || ''}')">← Back to Lesson</button>`;
      document.getElementById('app').innerHTML = html;
    }

    function renderEnrollmentMode() {
      const enrollments = getEnrollmentData();
      const totalStudents = enrollments.reduce((sum, e) => sum + (parseInt(e.total_learners) || 0), 0);
      const totalBoys = enrollments.reduce((sum, e) => sum + (parseInt(e.boys) || 0), 0);
      const totalGirls = enrollments.reduce((sum, e) => sum + (parseInt(e.girls) || 0), 0);

      let html = `<button class="btn btn-secondary" style="margin-bottom:12px;" onclick="goHome()">← Back to Home</button>`;
      html += `<h2>📊 District Enrollment Statistics</h2>`;
      
      html += `<div class="stats-card"><h4>${totalStudents}</h4><p>Total Enrollment (All Schools)</p></div>`;
      html += `<div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;">`;
      html += `<div class="stats-card" style="background:linear-gradient(135deg, #2b6cb0, #1a365d);"><h4>${totalBoys}</h4><p>Total Boys</p></div>`;
      html += `<div class="stats-card" style="background:linear-gradient(135deg, #d53f8c, #831843);"><h4>${totalGirls}</h4><p>Total Girls</p></div></div>`;

      html += `<div class="card"><h4>📝 Submit School Enrollment</h4>`;
      html += `<form onsubmit="submitEnrollment(event)">`;
      html += `<label>Select School</label>`;
      html += `<select id="school_select" required onchange="autoFillSchoolCode()">`;
      html += `<option value="">-- Choose School --</option>`;
      html += `<optgroup label="Secondary Schools">`;
      zakaSchools.secondary.forEach(s => html += `<option value="${s.name}" data-code="${s.code}">${s.name} (${s.code})</option>`);
      html += `</optgroup><optgroup label="Primary Schools">`;
      zakaSchools.primary.forEach(s => html += `<option value="${s.name}" data-code="${s.code}">${s.name} (${s.code})</option>`);
      html += `</optgroup></select>`;
      
      html += `<label>School Code (EMIS)</label><input type="text" id="school_code" readonly required>`;
      html += `<label>Term</label><select id="term" required><option>Term 1</option><option>Term 2</option><option>Term 3</option></select>`;
      html += `<label>Year</label><input type="number" id="year" value="2026" required>`;
      html += `<label>Total Learners Enrolled</label><input type="number" id="total_learners" required>`;
      html += `<label>Boys</label><input type="number" id="boys" required>`;
      html += `<label>Girls</label><input type="number" id="girls" required>`;
      html += `<label>Form 1 Enrollment</label><input type="number" id="form1" required>`;
      html += `<label>Form 2 Enrollment</label><input type="number" id="form2" required>`;
      html += `<label>Form 3 Enrollment</label><input type="number" id="form3" required>`;
      html += `<label>Form 4 Enrollment</label><input type="number" id="form4" required>`;
      
      html += `<button type="submit" class="btn btn-whatsapp">💬 Submit via WhatsApp to District Office</button>`;
      html += `</form></div>`;

      if (enrollments.length > 0) {
        html += `<h3 style="margin-top:20px;">📤 Recent Submissions</h3>`;
        enrollments.slice(-5).reverse().forEach(e => {
          html += `
            <div class="card">
              <h4>${e.school_name}</h4>
              <p><b>Term:</b> ${e.term} ${e.year} | <b>Total:</b> ${e.total_learners} learners</p>
              <p><b>Boys:</b> ${e.boys} | <b>Girls:</b> ${e.girls}</p>
              <p style="color:var(--text-muted); font-size:0.8rem;">${new Date(e.timestamp).toLocaleString()}</p>
            </div>`;
        });
      }

      document.getElementById('app').innerHTML = html;
    }

    function autoFillSchoolCode() {
      const select = document.getElementById('school_select');
      const selectedOption = select.options[select.selectedIndex];
      const code = selectedOption.getAttribute('data-code');
      if (code) document.getElementById('school_code').value = code;
    }

    function submitEnrollment(event) {
      event.preventDefault();
      
      const enrollmentData = {
        school_name: document.getElementById('school_select').value,
        school_code: document.getElementById('school_code').value,
        term: document.getElementById('term').value,
        year: document.getElementById('year').value,
        total_learners: document.getElementById('total_learners').value,
        boys: document.getElementById('boys').value,
        girls: document.getElementById('girls').value,
        form1: document.getElementById('form1').value,
        form2: document.getElementById('form2').value,
        form3: document.getElementById('form3').value,
        form4: document.getElementById('form4').value
      };

      saveEnrollmentData(enrollmentData);

      const message = `📊 *ENROLLMENT SUBMISSION*\n\n` +
        `*School:* ${enrollmentData.school_name}\n` +
        `*Code:* ${enrollmentData.school_code}\n` +
        `*Term:* ${enrollmentData.term} ${enrollmentData.year}\n\n` +
        `*Total Learners:* ${enrollmentData.total_learners}\n` +
        `*Boys:* ${enrollmentData.boys}\n` +
        `*Girls:* ${enrollmentData.girls}\n\n` +
        `*Form 1:* ${enrollmentData.form1}\n` +
        `*Form 2:* ${enrollmentData.form2}\n` +
        `*Form 3:* ${enrollmentData.form3}\n` +
        `*Form 4:* ${enrollmentData.form4}\n\n` +
        `_Submitted via Zaka District Schools Hub_`;

      const whatsappUrl = `https://wa.me/${DISTRICT_WHATSAPP}?text=${encodeURIComponent(message)}`;
      window.open(whatsappUrl, '_blank');

      alert('✅ Enrollment saved! WhatsApp opened - send to District Office.');
      renderEnrollmentMode();
    }

    function renderFormsPortal() {
      const f = content.forms;
      let html = `<button class="btn btn-secondary" style="margin-bottom:12px;" onclick="goHome()">← Back to Home</button>`;
      html += `<h2>${f.title}</h2><p style="color:var(--text-muted); margin-bottom:12px;">${f.description}</p>`;
      html += `<div class="card" style="background:#fffaf0; border-color:#f6ad55;">
        <p style="margin-bottom:0; font-size:0.85rem;"><b>How saving works:</b> filling a form and tapping "Save to This Device" stores it only on this phone — it stays here even after closing the app, and nothing is sent anywhere automatically. When you're ready to actually send it, open it below and tap Download PDF (to share the file yourself) or use WhatsApp where that option is offered.</p>
      </div>`;
      const categories = [...new Set(f.availableForms.map(form => form.category))];
      html += `<div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">`;
      html += `<button class="btn btn-secondary" onclick="filterForms('all', this)">All</button>`;
      categories.forEach(cat => {
        html += `<button class="btn btn-secondary" onclick="filterForms('${cat}', this)">${cat}</button>`;
      });
      html += `</div>`;

      f.availableForms.forEach(form => {
        html += `
          <div class="card">
            <h4>${form.name} <span class="badge badge-success">${form.category}</span></h4>
            <button class="btn btn-secondary" onclick="openForm('${form.id}')">📝 Fill Form</button>
          </div>`;
      });

      const submissions = getSubmissions();
      if (submissions.length > 0) {
        html += `<div class="sync-queue"><h4>💾 Saved on This Device (${submissions.length})</h4>
          <p style="font-size:0.8rem; color:#c05621; margin-bottom:10px;">These are drafts/completed forms stored locally. They will NOT reach the District Office on their own — download and share each one yourself.</p>`;
        submissions.forEach(sub => {
          const formName = f.availableForms.find(f => f.id === sub.formId)?.name || sub.formId;
          html += `
            <div class="sync-item">
              <div style="flex:1;">
                <strong>${formName}</strong><br>
                <small style="color:var(--text-muted);">Saved ${new Date(sub.timestamp).toLocaleString()}</small>
              </div>
              <div class="sync-item-actions">
                <button class="btn btn-success" onclick="exportPDF('${sub.id}')">⬇️ Download PDF</button>
                <button class="btn btn-danger" onclick="deleteSubmission('${sub.id}'); renderFormsPortal();">🗑️</button>
              </div>
            </div>`;
        });
        html += `</div>`;
      }
      document.getElementById('app').innerHTML = html;
    }

    function filterForms(category, button) {
      const f = content.forms;
      const container = document.getElementById('app');
      const cards = container.querySelectorAll('.card');
      cards.forEach(card => {
        const formName = card.querySelector('h4').textContent;
        card.style.display = (category === 'all' || formName.includes(category)) ? 'block' : 'none';
      });
      document.querySelectorAll('.btn-secondary').forEach(btn => { btn.style.backgroundColor = '#edf2f7'; btn.style.color = 'var(--text)'; });
      button.style.backgroundColor = 'var(--primary)';
      button.style.color = 'white';
    }

    function openForm(formId) {
      const form = content.forms.availableForms.find(f => f.id === formId);
      if (!form) return;
      let html = `<h2>${form.name}</h2><button class="btn btn-secondary" style="margin-bottom:12px;" onclick="renderFormsPortal()">← Back</button><form id="dynamicForm" onsubmit="handleFormSubmit(event, '${formId}')">`;
      form.fields.forEach(field => {
        html += `<label>${field.label}</label>`;
        if (field.type === 'textarea') html += `<textarea id="${field.id}" required></textarea>`;
        else if (field.type === 'select') {
          html += `<select id="${field.id}" required><option value="">Select...</option>`;
          field.options.forEach(opt => html += `<option value="${opt}">${opt}</option>`);
          html += `</select>`;
        } else html += `<input type="${field.type}" id="${field.id}" required>`;
      });
      html += `<button type="submit" class="btn">💾 Save to This Device</button></form>`;
      document.getElementById('app').innerHTML = html;
    }

    function handleFormSubmit(event, formId) {
      event.preventDefault();
      const form = content.forms.availableForms.find(f => f.id === formId);
      const formData = {};
      form.fields.forEach(field => { formData[field.label] = document.getElementById(field.id).value; });
      saveSubmission(formId, formData);
      alert('✅ Saved to this device. It will stay here — even after closing the app — until you download it or delete it. Nothing is sent automatically; find it under "Saved on This Device" below to download or share it.');
      renderFormsPortal();
    }

    async function exportPDF(submissionId) {
      const submissions = getSubmissions();
      const submission = submissions.find(s => s.id === submissionId);
      if (!submission) return;
      const form = content.forms.availableForms.find(f => f.id === submission.formId);
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFillColor(15, 61, 46);
      doc.rect(0, 0, 210, 40, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(16);
      doc.text('ZAKA DISTRICT SCHOOLS HUB', 105, 15, { align: 'center' });
      doc.setFontSize(12);
      doc.text(`Form: ${form.name}`, 105, 25, { align: 'center' });
      doc.text(`Submitted: ${new Date(submission.timestamp).toLocaleString()}`, 105, 33, { align: 'center' });
      doc.setTextColor(0, 0, 0);
      doc.setFontSize(11);
      let y = 60;
      Object.entries(submission.formData).forEach(([label, value]) => {
        if (y > 270) { doc.addPage(); y = 20; }
        doc.setFont(undefined, 'bold');
        doc.text(`${label}:`, 20, y);
        doc.setFont(undefined, 'normal');
        const valueLines = doc.splitTextToSize(String(value), 170);
        doc.text(valueLines, 20, y + 5);
        y += 5 + (valueLines.length * 5);
      });
      doc.setFontSize(9);
      doc.setTextColor(128, 128, 128);
      doc.text('Generated offline via Zaka District Schools AI Hub', 105, 290, { align: 'center' });
      doc.save(`${form.name.replace(/s+/g, '_')}_${submissionId}.pdf`);
    }

    function renderExaminations() {
      const e = content.examinations;
      let html = `<button class="btn btn-secondary" style="margin-bottom:12px;" onclick="goHome()">← Back to Home</button>`;
      html += `<h2>${e.title}</h2><p style="color:var(--text-muted); margin-bottom:12px;">${e.description}</p>`;

      const confirmed = getExamConfirmations();

      e.papers.forEach(paper => {
        const isConfirmed = confirmed.includes(paper.id);
        html += `
          <div class="card">
            <h4>${paper.subject} <span class="badge badge-success">${paper.form}</span></h4>
            <p><b>${paper.term} ${paper.year}</b></p>
            <div class="btn-row" style="display:flex; gap:8px;">
              <a href="${paper.file}" download style="flex:1;"><button class="btn" style="width:100%;">⬇️ Download Paper</button></a>
            </div>
            <button class="btn ${isConfirmed ? 'btn-success' : 'btn-whatsapp'}" style="width:100%; margin-top:8px;" onclick="confirmExamReceived('${paper.id}', '${paper.form}', '${paper.subject}', '${paper.term}', '${paper.year}')">
              ${isConfirmed ? '✅ Confirmed Received' : '💬 Confirm Received via WhatsApp'}
            </button>
          </div>`;
      });

      document.getElementById('app').innerHTML = html;
    }

    function getExamConfirmations() {
      const data = localStorage.getItem('zaka_exam_confirmations');
      return data ? JSON.parse(data) : [];
    }

    function confirmExamReceived(id, form, subject, term, year) {
      const confirmed = getExamConfirmations();
      if (!confirmed.includes(id)) {
        confirmed.push(id);
        localStorage.setItem('zaka_exam_confirmations', JSON.stringify(confirmed));
      }
      const message = `✅ *EXAM PAPER RECEIVED*\n\n` +
        `*Form:* ${form}\n` +
        `*Subject:* ${subject}\n` +
        `*Term:* ${term} ${year}\n\n` +
        `_Confirmed via Zaka District Schools Hub_`;
      window.open(`https://wa.me/${DISTRICT_WHATSAPP}?text=${encodeURIComponent(message)}`, '_blank');
      renderExaminations();
    }

    function renderNotices() {
      const n = content.notices;
      const role = getUserRole();
      // Learners only see items marked "all" or "learner"; everyone else
      // (teacher/admin) sees everything, since teacher/admin notices are
      // relevant across both those roles in a small school office.
      const visibleItems = (role === 'learner')
        ? n.items.filter(item => item.audience === 'all' || item.audience === 'learner')
        : n.items;
      let html = `<button class="btn btn-secondary" style="margin-bottom:12px;" onclick="goHome()">← Back to Home</button>`;
      html += `<h2>${n.title}</h2><p style="color:var(--text-muted); margin-bottom:12px;">${n.description}</p>`;
      visibleItems.forEach(item => {
        const priorityClass = item.priority === 'High' ? 'badge-high' : 'badge-success';
        html += `
          <div class="card">
            <h4>${item.subject} <span class="badge ${priorityClass}">${item.priority}</span></h4>
            <p><b>From:</b> ${item.from} | <b>Date:</b> ${item.date}</p>
            <p>${item.summary}</p>
            ${item.file ? `<a href="${item.file}" download><button class="btn" style="width:100%;">⬇️ Download Full Document</button></a>` : ''}
          </div>`;
      });
      document.getElementById('app').innerHTML = html;
    }

    // Init
    initPIN();
    updateNavVisibility();
    navTo('home', document.getElementById('nav-home'));
    updateOfflineIndicator();
  </script>

  <script type="module">
    // ── FIREBASE AUTH & ROLE CHECK ─────────────────────────────────────
    // Kept as its own module, separate from the main app script above,
    // so this piece can be tested/rolled back independently. Exposes a
    // small set of functions on window for the main script to call.
    import { auth, db } from "./js/firebase-config.js";
    import {
      signInWithEmailAndPassword,
      setPersistence,
      browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    // Signs in and returns { success, uid } or { success: false, message }.
    window.firebaseStaffSignIn = async function(email, password) {
      try {
        await setPersistence(auth, browserSessionPersistence);
        const result = await signInWithEmailAndPassword(auth, email, password);
        return { success: true, uid: result.user.uid };
      } catch (error) {
        let message = 'Sign-in failed. Check your connection and try again.';
        if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
          message = 'Incorrect email or password.';
        } else if (error.code === 'auth/too-many-requests') {
          message = 'Too many attempts. Please wait and try again.';
        }
        console.error('Staff sign-in error:', error.code, error.message);
        return { success: false, message };
      }
    };

    // Reads staff/{uid} from Firestore and returns the role string, or null
    // if the document doesn't exist (i.e. this account has no staff role).
    window.getStaffRole = async function(uid) {
      try {
        const snap = await getDoc(doc(db, 'staff', uid));
        if (!snap.exists()) return null;
        return snap.data().role || null;
      } catch (error) {
        console.error('Role lookup error:', error.code, error.message);
        return null;
      }
    };
  </script>
</body>
